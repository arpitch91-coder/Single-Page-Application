<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Street Bites SPA - Fast, responsive street food ordering application.">
  <title>Street Bites | Modern Street Food</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <a href="/" class="logo" data-link>🍔 Street<span>Bites</span></a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>

    <nav class="nav" id="navMenu">
      <a href="/" class="nav-link" data-link>Home</a>
      <a href="/menu" class="nav-link" data-link>Our Menu</a>
      <a href="/about" class="nav-link" data-link>About</a>
      <a href="/contact" class="nav-link" data-link>Contact</a>
    </nav>

    <a href="/menu" class="cart-link" data-link aria-label="Shopping Cart">
      🛒 Cart <span id="cartCount">0</span>
    </a>
  </header>

  <!-- Dynamic Content View Shell -->
  <main id="app" role="main" aria-live="polite">
    <!-- Views (Home, Menu, About, Contact, 404) are dynamically injected here -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <a href="/" class="logo" data-link>🍔 Street<span>Bites</span></a>
    <p>Made with ❤️ for food lovers everywhere.</p>
    <p>© <span id="year"></span> Street Bites. All rights reserved.</p>
  </footer>

  <!-- Toast Notification System -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js" type="module"></script>
</body>
</html>
